<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 中转站</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <a class="brand" href="./" aria-label="中转站首页"><span aria-hidden="true">⇄</span> 中转站</a>
      <div class="header-actions">
        <span id="connection" class="connection">连接中</span>
        <button id="new-task" class="primary compact">＋ 新任务</button>
        <button id="setup" class="icon-button" aria-label="接入 AI" title="接入 AI">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m9 3 1-1h4l1 3 2 1 3-.5 2 3.5-2 2v2l2 2-2 3.5-3-.5-2 1-1 3h-4l-1-3-2-1-3 .5-2-3.5 2-2v-2l-2-2 2-3.5 3 .5 2-1Z" transform="translate(1 0) scale(.92)"/></svg>
        </button>
      </div>
    </header>
    <main class="main">
      <div id="task-bar" class="task-bar" hidden>
        <div class="task-picker">
          <label for="task-select" class="sr-only">选择任务</label>
          <select id="task-select"></select>
        </div>
        <span id="task-status" class="status"></span>
        <details id="task-menu" class="task-menu">
          <summary aria-label="更多任务操作" title="更多操作">···</summary>
          <div class="menu-items">
            <button id="copy-task-id">复制任务 ID</button>
            <button id="export">导出记录</button>
            <button id="retry" hidden>重新排队</button>
            <button id="close-task" class="danger" title="停止后续投递，正在执行的工作请在 Codex 中停止。">结束任务</button>
          </div>
        </details>
      </div>
      <section class="conversation" aria-label="任务消息">
        <div id="empty-state" class="empty-state">
          <div class="empty-icon" aria-hidden="true">⇄</div>
          <h1>一起完成一个任务</h1>
          <p>提出任务，收回结果，再给一点意见。</p>
          <button id="empty-create" class="primary">新建任务</button>
        </div>
        <div id="task-view" class="task-view" hidden>
          <h1 id="task-title" class="sr-only"></h1>
          <div id="timeline" class="timeline" aria-live="polite"></div>
          <div class="composer-area">
            <p id="status-note" class="status-note"></p>
            <form id="feedback-form" class="feedback-form" hidden>
              <label for="feedback" class="sr-only">补充意见</label>
              <textarea id="feedback" rows="2" placeholder="补充意见，继续完善这个任务…" maxlength="100000" required></textarea>
              <button class="send-button" type="submit" aria-label="发送意见" title="发送意见">↑</button>
            </form>
          </div>
        </div>
      </section>
    </main>
  </div>
  <dialog id="login-dialog">
    <form id="login-form">
      <h2>连接中转站</h2><p>使用本机访问密钥连接。</p>
      <label for="token">访问密钥</label><input id="token" type="password" autocomplete="off" required>
      <p id="login-error" class="error"></p><button class="primary" type="submit">连接</button>
      <details class="disclosure"><summary>找不到密钥？</summary><p>在项目目录运行 <code>python3 relay.py open</code> 自动连接，或使用数据目录中 ui.token 的内容。</p></details>
    </form>
  </dialog>
  <dialog id="create-dialog">
    <form id="create-form">
      <div class="dialog-heading"><h2>新任务</h2><button class="icon-button" type="button" data-dismiss="create-dialog" aria-label="关闭新任务">×</button></div>
      <label for="title">标题</label><input id="title" maxlength="160" placeholder="要完成什么？" required>
      <label for="content">内容</label><textarea id="content" rows="5" maxlength="100000" placeholder="描述任务，以及你期望的结果…" required></textarea>
      <details class="disclosure advanced-options"><summary>更多选项</summary><div class="round-setting"><label for="max-rounds">最多执行轮数</label><input id="max-rounds" type="number" min="1" max="12" value="4"><span>包含首次执行</span></div></details>
      <div class="dialog-footer"><button class="primary" type="submit">发送任务 ↑</button></div>
    </form>
  </dialog>
  <dialog id="setup-dialog">
    <div class="dialog-heading"><h2>接入 AI</h2><button class="icon-button" data-dismiss="setup-dialog" aria-label="关闭接入设置">×</button></div>
    <p>连接 Claude Code 或 Cursor，让它们向这里发送任务。</p>
    <button id="copy-instructions" class="primary">复制协作说明</button>
    <details class="disclosure"><summary>MCP 配置</summary><pre id="mcp-config"></pre><button id="copy-config" class="secondary">复制配置</button></details>
    <details class="disclosure"><summary>查看协作说明</summary><pre id="other-ai"></pre></details>
    <details class="disclosure"><summary>连接信息</summary><dl class="connection-info"><dt>当前 Codex 聊天</dt><dd id="bound-title"></dd><dt>最近收件</dt><dd id="last-poll"></dd><dt>收件间隔</dt><dd id="interval-note"></dd></dl></details>
    <p class="footnote">另一边需要保持运行，并等待执行结果。</p>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
